<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HEC Secure Portal</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    background: white;
    color: black;
    padding: 30px;
    border-radius: 10px;
    width: 300px;
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
}

button {
    width: 100%;
    padding: 10px;
    background: green;
    color: white;
    border: none;
}
</style>
</head>

<body>

<div class="box">
    <h2>HEC Secure Portal</h2>

    <form id="loginForm">
        <input type="text" id="userCNIC" placeholder="Enter CNIC" required>
        <input type="text" id="userPhone" placeholder="Enter Phone Number" required>

        <button type="submit">Login</button>
    </form>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<script src="script.js"></script>

</body>
</html>
